<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moyi Cumple 🧱🔥</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#1a1a2e;
            font-family:'Segoe UI', Tahoma, sans-serif;
            color:white;
            text-align:center;
            padding:20px;
            max-width:500px;
            margin:auto;
        }
        h1 { color:#ffb347; margin-bottom:5px; font-size:26px; }
        .subtitulo { opacity:0.8; margin-bottom:20px; font-size:14px; }
        .base-leyenda {
            background:#6b6b6b;
            border-radius:8px;
            padding:10px;
            font-weight:bold;
            margin-bottom:10px;
            border:2px solid #ffb347;
            font-size:14px;
        }
        .base-dibujo {
            display:flex;
            flex-direction:column-reverse;
            gap:2px;
            margin:10px 0;
        }
        .base-dibujo .fila {
            display:flex;
            justify-content:center;
            gap:2px;
        }
        .base-ladrillo {
            width:30px;
            height:12px;
            background:#6b6b6b;
            border:1px solid #aaa;
            border-radius:2px;
        }
        .puertas {
            display:flex;
            justify-content:center;
            gap:12px;
            margin:8px 0;
        }
        .puerta {
            width:24px;
            height:30px;
            background:#1a1a1a;
            border:2px solid #ffb347;
            border-radius:4px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:10px;
            font-weight:bold;
        }
        .estufa {
            display:flex;
            flex-direction:column-reverse;
            gap:2px;
            margin:20px 0;
            transition: transform 0.8s ease;
        }
        .estufa.girada {
            transform: rotateY(90deg);
        }
        .fila {
            display:flex;
            justify-content:center;
            gap:2px;
        }
        .ladrillo {
            width:30px;
            height:18px;
            background:#c46a3a;
            border:1px solid #f5e6d3;
            border-radius:3px;
            transition: all 0.5s ease;
            font-size:7px;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            white-space:nowrap;
            text-overflow:ellipsis;
            color:white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.7);
            cursor:default;
        }
        .ladrillo.vacio {
            background:transparent;
            border:1px dashed rgba(255,255,255,0.3);
        }
        .ladrillo.parcial {
            background: linear-gradient(90deg, #c46a3a 0%, #c46a3a var(--progreso, 50%), #8a3d22 var(--progreso, 50%));
            opacity:0.7;
        }
        .ladrillo.interno {
            background: #555;
            border:1px solid #ffb347;
        }
        .progreso {
            background:#2d2d2d;
            border-radius:12px;
            padding:15px;
            margin:20px 0;
        }
        .barra {
            background:#444;
            border-radius:20px;
            height:30px;
            overflow:hidden;
        }
        .relleno {
            background:linear-gradient(90deg, #b85c38, #ffb347);
            height:100%;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            font-size:14px;
            transition:width 0.8s ease;
        }
        .stats {
            display:flex;
            gap:10px;
            margin-top:15px;
        }
        .stat {
            flex:1;
            background:#2d2d2d;
            padding:10px;
            border-radius:10px;
        }
        .stat span {
            font-size:20px;
            font-weight:bold;
            color:#ffb347;
        }
        .stat small {
            display:block;
            font-size:11px;
            opacity:0.7;
        }
        .boton {
            background:#ffb347;
            color:#1a1a2e;
            border:none;
            padding:15px 25px;
            border-radius:50px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            width:100%;
            margin:10px 0;
        }
        .boton:active { transform:scale(0.95); }
        .boton.secundario {
            background:transparent;
            border:2px solid rgba(255,255,255,0.4);
            color:white;
        }
        .modal {
            display:none;
            position:fixed;
            top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.8);
            align-items:center;
            justify-content:center;
            z-index:100;
        }
        .modal-content {
            background:#1e1e2e;
            padding:25px;
            border-radius:20px;
            border:2px solid #ffb347;
            width:90%;
            max-width:350px;
        }
        .modal-content input,
        .modal-content textarea {
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #ffb347;
            background:#2a2a3e;
            color:white;
            font-size:16px;
            margin:8px 0;
            text-align:center;
            font-family:inherit;
        }
        .modal-content textarea {
            min-height:80px;
            resize:vertical;
            text-align:left;
        }
        .modal-content button {
            background:#ffb347;
            color:#1a1a2e;
            border:none;
            padding:12px;
            border-radius:25px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            width:100%;
            margin:5px 0;
        }
        .modal-content button.cancelar {
            background:#e74c3c;
            color:white;
        }
        .alias {
            background:#2a2a3e;
            border:1px dashed #ffb347;
            border-radius:10px;
            padding:10px;
            margin:8px 0;
            font-size:14px;
        }
        .alias strong {
            color:#ffb347;
            display:block;
            font-size:11px;
            margin-bottom:3px;
            letter-spacing:1px;
        }
        .alias .valor {
            font-size:16px;
            font-weight:bold;
            user-select:all;
        }
        .toast {
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.9);
            color:#2ecc71;
            padding:15px 25px;
            border-radius:30px;
            z-index:200;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
            border:1px solid #2ecc71;
            font-size:16px;
        }
        .mensaje {
            background:#2d2d2d;
            border-left:3px solid #ffb347;
            padding:10px;
            border-radius:8px;
            margin-bottom:8px;
            font-size:13px;
            text-align:left;
        }
        .mensaje .autor {
            color:#ffb347;
            font-weight:bold;
            font-size:12px;
            margin-bottom:3px;
        }
        .mensaje .texto {
            opacity:0.9;
        }
        .seccion-mensajes {
            display:none;
        }
        .seccion-mensajes.visible {
            display:block;
        }
    </style>
</head>
<body>
    <h1>⚽ MOYI CUMPLE 🧱</h1>
    <p class="subtitulo">La Estufa del Refugio 🔥</p>

    <!-- Estufa (ladrillos) -->
    <div class="estufa" id="estufa"></div>

    <!-- Puertas (sobre la base) -->
    <div class="puertas">
        <div class="puerta">🚪</div>
        <div class="puerta">🚪</div>
    </div>

    <!-- Base dibujada -->
    <div class="base-leyenda">🧱 LA BASE ESTÁ ✅</div>
    <div class="base-dibujo" id="baseDibujo"></div>

    <!-- Progreso (SIN monto) -->
    <div class="progreso">
        <div class="barra">
            <div class="relleno" id="relleno" style="width:0%">0%</div>
        </div>
        <div class="stats">
            <div class="stat">
                <span id="ladrillosPuestos">0</span>
                <small>Ladrillos puestos</small>
            </div>
        </div>
    </div>

    <!-- Botones principales -->
    <button class="boton" onclick="abrirModal()">🧱 PONER LADRILLOS</button>
    <button class="boton secundario" onclick="toggleMensajes()">💌 VER MENSAJES</button>
    <button class="boton secundario" onclick="abrirModalMensaje()">✍️ DEJAR UN MENSAJE</button>
    <button class="boton secundario" onclick="verInterior()">🩻 VER INTERIOR (CORTE TRANSVERSAL)</button>
    <a class="boton secundario" href="https://drive.google.com/file/d/1GgSeMMCyLdA9kxjJWhSaqpRvQBUBnLLQ/view?usp=drivesdk" target="_blank" style="text-decoration:none; display:block; text-align:center;">📖 CHUSMEÁ EL MANUAL</a>
    <a class="boton secundario" href="https://drive.google.com/file/d/1bwon_lsGFb0mgeouGxkHP8SKRgS2IYQ5/view?usp=drivesdk" target="_blank" style="text-decoration:none; display:block; text-align:center;">🖼️ VER CORTE TRANSVERSAL (IMAGEN)</a>

    <!-- Mensajes para Moyi (oculto por defecto) -->
    <div class="progreso seccion-mensajes" id="seccionMensajes" style="text-align:left;">
        <h3 style="color:#ffb347; margin-bottom:10px; text-align:center;">💌 Mensajes para Moyi</h3>
        <div id="listaMensajes"></div>
    </div>

    <!-- Modal transferencia -->
    <div class="modal" id="modalDonacion">
        <div class="modal-content">
            <h2>💰 ¿Cuánto transferiste?</h2>
            <div class="alias">
                <strong>ALIAS</strong>
                <div class="valor">unladrilloparamoyi</div>
            </div>
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <input type="number" id="monto" placeholder="Monto en $" min="1" required>
            <button onclick="procesarDonacion()">⚽ CONSTRUIR</button>
            <button class="cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <!-- Modal mensaje -->
    <div class="modal" id="modalMensaje">
        <div class="modal-content">
            <h2>💌 Dejale un mensaje a Moyi</h2>
            <input type="text" id="nombreMensaje" placeholder="Tu nombre" required>
            <textarea id="textoMensaje" placeholder="Escribí tu mensaje..." required></textarea>
            <button onclick="enviarMensaje()">💌 ENVIAR</button>
            <button class="cancelar" onclick="cerrarModalMensaje()">Cancelar</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ===== CONFIGURACIÓN DE FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyCMPscNifbJq-hpKKoT16qx2iSidoEFDjc",
            authDomain: "estufa-moyi-65f87.firebaseapp.com",
            projectId: "estufa-moyi-65f87",
            storageBucket: "estufa-moyi-65f87.firebasestorage.app",
            messagingSenderId: "1030481388441",
            appId: "1:1030481388441:web:7a75cfe46a21e28eb9e908"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const PRECIO_LADRILLO = 7531.30;
        let modoRayosX = false;
        let bricksData = [];

        // ===== ESTRUCTURA VISUAL =====
        function generarBaseDibujo() {
            const contenedor = document.getElementById('baseDibujo');
            contenedor.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const fila = document.createElement('div');
                fila.className = 'fila';
                for (let j = 0; j < 6; j++) {
                    const ladrillo = document.createElement('div');
                    ladrillo.className = 'base-ladrillo';
                    fila.appendChild(ladrillo);
                }
                contenedor.appendChild(fila);
            }
        }

        function generarEstufa() {
            const contenedor = document.getElementById('estufa');
            contenedor.innerHTML = '';
            bricksData = [];
            for (let i = 0; i < 20; i++) {
                const fila = document.createElement('div');
                fila.className = 'fila';
                const cantidad = (i === 0 || i === 19) ? 6 : (i % 2 === 0 ? 5 : 6);
                for (let j = 0; j < cantidad; j++) {
                    const ladrillo = document.createElement('div');
                    ladrillo.className = 'ladrillo vacio';
                    ladrillo.dataset.index = bricksData.length;
                    bricksData.push({ funded: 0, donors: [] });
                    fila.appendChild(ladrillo);
                }
                contenedor.appendChild(fila);
            }
            escucharFirebase();
        }

        // ===== SINCRONIZACIÓN CON FIREBASE =====
        function escucharFirebase() {
            const bricksRef = database.ref('bricks');
            bricksRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                bricksData = [];
                for (let i = 0; i < 20; i++) {
                    const cantidad = (i === 0 || i === 19) ? 6 : (i % 2 === 0 ? 5 : 6);
                    for (let j = 0; j < cantidad; j++) {
                        const index = bricksData.length;
                        bricksData.push(data[index] || { funded: 0, donors: [] });
                    }
                }
                actualizarVisual();
            });
        }

        function actualizarVisual() {
            const todos = document.querySelectorAll('.ladrillo');
            todos.forEach(el => {
                const idx = parseInt(el.dataset.index);
                const data = bricksData[idx] || { funded: 0, donors: [] };
                el.innerHTML = '';
                el.className = 'ladrillo';
                if (data.funded <= 0) {
                    el.className = 'ladrillo vacio';
                } else if (data.funded < PRECIO_LADRILLO) {
                    el.className = 'ladrillo parcial';
                    const porcentaje = (data.funded / PRECIO_LADRILLO) * 100;
                    el.style.setProperty('--progreso', `${porcentaje}%`);
                    el.textContent = data.donors.join('+');
                } else {
                    el.className = 'ladrillo';
                    el.textContent = data.donors.join('+');
                }
                if (modoRayosX) {
                    el.classList.add('interno');
                } else {
                    el.classList.remove('interno');
                }
            });

            const completos = bricksData.filter(b => b.funded >= PRECIO_LADRILLO).length;
            document.getElementById('ladrillosPuestos').textContent = completos;

            const financiado = bricksData.reduce((sum, b) => sum + b.funded, 0);
            const TOTAL_ESTIMADO = bricksData.length * PRECIO_LADRILLO;
            const porcentaje = Math.min(100, Math.round((financiado / TOTAL_ESTIMADO) * 100));
            document.getElementById('relleno').style.width = porcentaje + '%';
            document.getElementById('relleno').textContent = porcentaje + '%';
        }

        // ===== MENSAJES =====
        function escucharMensajes() {
            const mensajesRef = database.ref('mensajes');
            mensajesRef.on('value', (snapshot) => {
                const data = snapshot.val() || {};
                const contenedor = document.getElementById('listaMensajes');
                contenedor.innerHTML = '';
                const lista = Object.values(data);
                if (lista.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:13px;">Aún no hay mensajes</p>';
                    return;
                }
                lista.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                lista.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'mensaje';
                    div.innerHTML = `<div class="autor">${msg.nombre || 'Anónimo'}</div><div class="texto">${msg.texto || ''}</div>`;
                    contenedor.appendChild(div);
                });
            });
        }

        function toggleMensajes() {
            const seccion = document.getElementById('seccionMensajes');
            seccion.classList.toggle('visible');
            if (seccion.classList.contains('visible')) {
                setTimeout(() => {
                    seccion.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        }

        // ===== ENVIAR MENSAJE =====
        function abrirModalMensaje() {
            document.getElementById('modalMensaje').style.display = 'flex';
            document.getElementById('nombreMensaje').focus();
        }
        function cerrarModalMensaje() {
            document.getElementById('modalMensaje').style.display = 'none';
            document.getElementById('nombreMensaje').value = '';
            document.getElementById('textoMensaje').value = '';
        }
        function enviarMensaje() {
            const nombre = document.getElementById('nombreMensaje').value.trim();
            const texto = document.getElementById('textoMensaje').value.trim();
            if (!nombre) { mostrarToast('⚠️ Poné tu nombre'); return; }
            if (!texto) { mostrarToast('⚠️ Escribí un mensaje'); return; }

            const mensajesRef = database.ref('mensajes');
            mensajesRef.push({
                nombre: nombre,
                texto: texto,
                timestamp: Date.now()
            }).then(() => {
                cerrarModalMensaje();
                mostrarToast('💌 ¡Mensaje enviado!');
            }).catch(error => {
                console.error(error);
                mostrarToast('⚠️ Error al enviar el mensaje');
            });
        }

        // ===== PROCESAR TRANSFERENCIA =====
        function procesarDonacion() {
            const nombre = document.getElementById('nombre').value.trim();
            const monto = parseInt(document.getElementById('monto').value);
            if (!nombre) { mostrarToast('⚠️ Poné tu nombre'); return; }
            if (!monto || monto <= 0) { mostrarToast('⚠️ Ingresá un monto válido'); return; }
            cerrarModal();

            const bricksRef = database.ref('bricks');
            bricksRef.once('value').then(snapshot => {
                const bricks = snapshot.val() || {};
                let restante = monto;
                let completados = 0;
                for (let i = 0; i < bricksData.length && restante > 0; i++) {
                    const brick = bricks[i] || { funded: 0, donors: [] };
                    const faltante = PRECIO_LADRILLO - brick.funded;
                    if (faltante > 0) {
                        const aporte = Math.min(restante, faltante);
                        brick.funded += aporte;
                        restante -= aporte;
                        if (!brick.donors.includes(nombre)) {
                            brick.donors.push(nombre);
                        }
                        if (brick.funded >= PRECIO_LADRILLO) {
                            completados++;
                        }
                        bricks[i] = brick;
                    }
                }
                return bricksRef.set(bricks).then(() => {
                    let mensaje = `⚽ ¡Gracias ${nombre}!`;
                    if (completados > 0) mensaje += ` Completaste ${completados} ladrillo(s) 🧱`;
                    else mensaje += ` Tu aporte suma a un ladrillo 🧱`;
                    mostrarToast(mensaje);
                });
            }).catch(error => {
                console.error(error);
                mostrarToast('⚠️ Error al guardar la transferencia');
            });
        }

        // ===== MODO RAYOS X =====
        function verInterior() {
            modoRayosX = !modoRayosX;
            const estufa = document.getElementById('estufa');
            if (modoRayosX) {
                estufa.classList.add('girada');
                mostrarToast('🩻 Corte transversal activado');
            } else {
                estufa.classList.remove('girada');
                mostrarToast('🧱 Vista normal');
            }
            actualizarVisual();
        }

        // ===== MODAL Y TOAST =====
        function abrirModal() {
            document.getElementById('modalDonacion').style.display = 'flex';
            document.getElementById('nombre').focus();
        }
        function cerrarModal() {
            document.getElementById('modalDonacion').style.display = 'none';
            document.getElementById('nombre').value = '';
            document.getElementById('monto').value = '';
        }
        function mostrarToast(mensaje) {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }

        // ===== INICIALIZAR =====
        generarBaseDibujo();
        generarEstufa();
        escucharMensajes();
    </script>
</body>
</html>
